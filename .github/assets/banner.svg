<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
    <defs>
        <!-- Refined Executive Slate Gradient -->
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0b1120"/>
            <stop offset="100%" stop-color="#162032"/>
        </linearGradient>

        <!-- Subtle Accent Line Gradient -->
        <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="50%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>

        <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- Main Card Container -->
    <rect x="15" y="15" width="870" height="170" rx="14" fill="url(#bg)" stroke="#26354a" stroke-width="1.2" filter="url(#cardShadow)"/>

    <!-- Subtle Top Accent Border -->
    <path d="M 29 15 L 871 15" stroke="url(#accentLine)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Left: Status Pill -->
    <g transform="translate(50, 42)">
        <rect x="0" y="0" width="180" height="22" rx="11" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.28)" stroke-width="1"/>
        <circle cx="11" cy="11" r="3.5" fill="#10b981"/>
        <text x="22" y="15" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">OPEN TO OPPORTUNITIES</text>
    </g>

    <!-- Name Heading -->
    <text x="50" y="100" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5">Gauri Kadalge</text>

    <!-- Professional Subtitle -->
    <text x="50" y="128" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">
        AI &amp; Machine Learning Engineer &bull; Computer Science &amp; Engineering &bull; Systems &amp; Telemetry
    </text>

    <!-- Affiliation / Honors Line -->
    <g transform="translate(50, 154)">
        <text fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, monospace" font-size="11.5" font-weight="500">
            <tspan fill="#cbd5e1" font-weight="600">VIT Pune</tspan> &bull; Finalist @ <tspan fill="#38bdf8">Mumbai Hacks 2025</tspan> &bull; Project @ <tspan fill="#818cf8">iSIH 2026 (OFFAIR)</tspan>
        </text>
    </g>

    <!-- Right: Monogram Box -->
    <g transform="translate(760, 48)">
        <rect x="0" y="0" width="76" height="76" rx="14" fill="#111a2c" stroke="#2d3d56" stroke-width="1.2"/>
        <text x="38" y="46" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5">GK</text>
        <text x="38" y="63" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" letter-spacing="1">DEV</text>
    </g>
</svg>
