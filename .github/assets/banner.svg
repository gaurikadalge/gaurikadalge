<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 115" width="860" height="115">
    <defs>
        <!-- Refined Executive Dark Navy Gradient -->
        <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0b0f19"/>
            <stop offset="60%" stop-color="#111827"/>
            <stop offset="100%" stop-color="#0e1726"/>
        </linearGradient>

        <!-- Subtle Top Accent Highlight -->
        <linearGradient id="topAccent" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
            <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
        </linearGradient>

        <!-- Soft Glow behind name -->
        <radialGradient id="softGlow" cx="15%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
        </radialGradient>

        <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- Main Card Body -->
    <rect x="10" y="8" width="840" height="98" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" filter="url(#shadow)"/>
    
    <!-- Subtle Ambient Glow -->
    <rect x="10" y="8" width="840" height="98" rx="10" fill="url(#softGlow)"/>

    <!-- Sleek Top Accent Line -->
    <path d="M 20 8 L 840 8" stroke="url(#topAccent)" stroke-width="2" stroke-linecap="round"/>

    <!-- 1. Name -->
    <text x="38" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.4">
        Gauri Kadalge
    </text>

    <!-- 2. AI & ML Engineer Line -->
    <text x="38" y="69" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="14.5" font-weight="450" letter-spacing="-0.1">
        AI &amp; Machine Learning Engineer
    </text>

    <!-- 3. VIT Pune -->
    <text x="38" y="90" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.3">
        VIT Pune
    </text>
</svg>
