<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
    <defs>
        <!-- Background Gradient (Subtle Executive Slate) -->
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#090d16"/>
            <stop offset="50%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#111c33"/>
        </linearGradient>

        <!-- Accent Gradient (Cyan to Indigo) -->
        <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="50%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#a855f7"/>
        </linearGradient>

        <!-- Text Gradient -->
        <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="60%" stop-color="#f0f9ff"/>
            <stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>

        <!-- Soft Glow Filter -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
        </filter>

        <!-- Rounded clipping for inner elements -->
        <clipPath id="cardClip">
            <rect x="20" y="20" width="860" height="180" rx="20"/>
        </clipPath>
    </defs>

    <!-- Card Background -->
    <rect x="20" y="20" width="860" height="180" rx="20" fill="url(#bg)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2" filter="url(#shadow)"/>

    <!-- Subtle Ambient Glow Orbs inside card -->
    <g clip-path="url(#cardClip)">
        <circle cx="820" cy="40" r="120" fill="#38bdf8" opacity="0.08" filter="blur(40px)"/>
        <circle cx="80" cy="180" r="100" fill="#6366f1" opacity="0.08" filter="blur(40px)"/>

        <!-- Animated top border light shimmer -->
        <rect x="-240" y="20" width="220" height="2.5" fill="url(#accent)">
            <animate attributeName="x" values="-240;920" dur="6.5s" repeatCount="indefinite"/>
        </rect>

        <!-- Subtle Grid Pattern Lines in Background -->
        <line x1="20" y1="70" x2="880" y2="70" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        <line x1="20" y1="120" x2="880" y2="120" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        <line x1="20" y1="170" x2="880" y2="170" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        <line x1="300" y1="20" x2="300" y2="200" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        <line x1="600" y1="20" x2="600" y2="200" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </g>

    <!-- Left Badge / Status Pill -->
    <g transform="translate(60, 52)">
        <rect x="0" y="0" width="240" height="24" rx="12" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
        <circle cx="12" cy="12" r="4" fill="#10b981">
            <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="24" y="16" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="0.4">OPEN FOR ML &amp; SWE ROLES</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="118" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.6">Gauri Kadalge</text>

    <!-- Subtitle / Tagline -->
    <text x="60" y="148" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14.5" font-weight="400">
        AI / Machine Learning Engineer <tspan fill="#38bdf8">&bull;</tspan> MLOps Pipelines <tspan fill="#38bdf8">&bull;</tspan> IoT Telemetry Systems
    </text>

    <!-- Bottom Highlights / Badges -->
    <g transform="translate(60, 168)">
        <text fill="#64748b" font-family="'JetBrains Mono', monospace, Consolas" font-size="11.5" font-weight="500">
            Finalist @ <tspan fill="#38bdf8">Mumbai Hacks 2025</tspan> &bull; Participant @ <tspan fill="#818cf8">iSIH 2026</tspan> &bull; <tspan fill="#cbd5e1">VIT Pune</tspan>
        </text>
    </g>

    <!-- Right-Side Tech Monogram & Circuit Nodes -->
    <g transform="translate(730, 60)">
        <!-- Outer hexagon / circle -->
        <rect x="0" y="0" width="88" height="88" rx="20" fill="rgba(15, 23, 42, 0.85)" stroke="url(#accent)" stroke-width="1.5"/>
        <text x="44" y="53" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800" letter-spacing="-1">GK</text>
        <text x="44" y="74" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="1.2">DEV</text>
    </g>
</svg>
